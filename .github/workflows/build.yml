name: Build Converter

on:
  schedule:
    - cron: '0 10 * * 1'
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Projekt-Narzedzia-Pracy-IT-60352

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: .\installResources.ps1

      - name: Build CLI executable
        run: pyinstaller --onefile converter.py

      - name: Build UI executable
        run: pyinstaller --onefile --noconsole converter_ui.py

      - uses: actions/upload-artifact@v4
        with:
          name: converter-exe
          path: |
            Projekt-Narzedzia-Pracy-IT-60352/dist/converter.exe
            Projekt-Narzedzia-Pracy-IT-60352/dist/converter_ui.exe
